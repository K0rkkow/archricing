# Profil d'installation ArchRicing — VALEURS PAR DÉFAUT.
# Calamares (module archricing_experience) écrit les choix utilisateur dans
# /etc/archricing/install-profile.conf (même format). archricing-postinstall
# applique ce fichier ; ArchRicing Settings peut le relire après installation.
# Indépendant de l'édition : SECURITY installe toujours toute sa suite.
EDITION=normal
THEME=sakura
WALLPAPER=archricing-sakura.svg
DOCK=floating
TOP_PANEL=on
TRANSPARENCY=on
BLUR=on
ANIMATIONS=on
WOBBLY=normal
ROUNDED=on
ICONS=Papirus-Dark
CURSOR=Bibata-Modern-Ice
TERMINAL=kitty
FASTFETCH=on
SHELL=zsh
STARSHIP=on
WELCOME=on
SETTINGS_APP=installed
SOFTWARE_APP=installed
UPDATE_APP=installed
