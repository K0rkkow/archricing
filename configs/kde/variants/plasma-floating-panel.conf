# Variante floating-panel — générée, ne pas éditer à la main.
# configs/kde/plasma-org.kde.plasma.desktop-appletsrc
# Layout ArchRicing : 1 panneau supérieur fin translucide + 1 dock bas-centre flottant.
# AUCUN widget invasif. Le dock est un panneau Plasma natif (pas latte-dock).
[Containments][1]
activityId=
formfactor=2
immutability=1
lastScreen=0
location=3
plugin=org.kde.panel
wallpaperplugin=org.kde.image

[Containments][1][General]
TvShow=false
lengthMode=1
alignment=0
offset=0
thickness=28
floating=false
opacity=70

[Containments][1][Applets][2]
plugin=org.kde.plasma.digitalclock

[Containments][1][Applets][3]
plugin=org.kde.plasma.networkmanagement

[Containments][1][Applets][4]
plugin=org.kde.plasma.volume

[Containments][1][Applets][5]
plugin=org.kde.plasma.bluetooth

[Containments][1][Applets][6]
plugin=org.kde.plasma.battery

[Containments][1][Applets][7]
plugin=org.kde.plasma.notifications

[Containments][1][Applets][8]
plugin=org.kde.plasma.lock_logout

[Containments][2]
activityId=
formfactor=2
immutability=1
lastScreen=0
location=4
plugin=org.kde.panel
wallpaperplugin=org.kde.image

[Containments][2][General]
lengthMode=1
alignment=132
offset=0
thickness=64
floating=true
opacity=65

[Containments][2][Applets][10]
plugin=org.kde.plasma.kickoff
[Containments][2][Applets][11]
plugin=org.kde.plasma.icon
[Containments][2][Applets][12]
plugin=org.kde.plasma.icontasks
