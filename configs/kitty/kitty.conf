# ArchRicing Kitty — transparent + blur, pastel cyber. Le wallpaper reste visible.
# Règle : jamais opaque par défaut. Tout est réglable dans ArchRicing Settings.
font_family JetBrainsMono Nerd Font
font_size 12.0
adjust_line_height 130%
adjust_column_width 100%
disable_ligatures never

# Fenêtre : padding généreux, coins arrondis (si compositor), pas de bordure
window_padding_width 16
window_margin_width 4
window_border_width 0
single_window_margin_width -1
hide_window_decorations no

# Transparence : fond presque transparent + blur (KWin gère le flou derrière)
background_opacity 0.72
background_blur 24
dynamic_background_opacity yes

# Couleurs ArchRicing Sakura (dark navy + cyan/rose/violet)
foreground #f2ecff
background #14162b
selection_foreground #14162b
selection_background #7dd7fc
cursor #ff7ac6
cursor_text_color #14162b
url_color #7dd7fc

color0 #1e2140
color1 #ff5f8f
color2 #5ff2b8
color3 #ffd479
color4 #6ea8ff
color5 #c792ea
color6 #7dd7fc
color7 #e8e4ff
color8 #4a4f7e
color9 #ff8fab
color10 #7bf0c4
color11 #ffe29a
color12 #9ec5ff
color13 #d8a7ff
color14 #a8ecff
color15 #f5f1ff

# Curseur élégant
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Onglets minimalistes
tab_bar_style powerline
tab_powerline_style round
active_tab_foreground #14162b
active_tab_background #ff7ac6
inactive_tab_foreground #b8bce0
inactive_tab_background #23264a

# Cloche discrète, scroll fluide
enable_audio_bell no
touch_scroll_multiplier 1.0
wheel_scroll_multiplier 3.0
