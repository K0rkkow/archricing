--- # calamares/modules/packagechooser@edition.conf
# Page "Choose your ArchRicing edition" — EXACTEMENT deux choix (radio).
# NORMAL et SECURITY partagent le même bureau ; SECURITY ajoute la suite officielle.
# (Les paquets AUR suivent au 1er boot via archricing-security-aur.service.)
id: edition
title: "Choose your ArchRicing edition"
zeroOrOne: false
mode: radio
items:
  - id: normal
    name: "🌸 NORMAL"
    description: "ArchRicing desktop with the complete visual experience."
    screenshot: ""
    selected: true
    packages: []
  - id: security
    name: "🛡️ SECURITY"
    description: "ArchRicing desktop + complete security toolkit."
    screenshot: ""
    selected: false
    packages:
      - nmap
      - masscan
      - rustscan
      - openbsd-netcat
      - socat
      - whois
      - bind
      - traceroute
      - mtr
      - arp-scan
      - tcpdump
      - wireshark-qt
      - mitmproxy
      - amass
      - subfinder
      - theharvester
      - dnsenum
      - ffuf
      - gobuster
      - feroxbuster
      - nikto
      - nuclei
      - sqlmap
      - wpscan
      - hydra
      - john
      - hashcat
      - exploitdb
      - smbclient
      - ghidra
      - radare2
      - rizin
      - binwalk
      - binutils
      - file
      - ltrace
      - strace
      - gdb
      - yara
      - upx
      - torbrowser-launcher
      - wireguard-tools
      - openvpn
      - mullvad-vpn
