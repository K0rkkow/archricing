# iso/profile/pacman.conf — OBLIGATOIRE pour mkarchiso (référencé par profiledef.sh).
# Ne pas utiliser le pacman.conf de l'hôte : celui-ci est versionné et reproductible.
[options]
HoldPkg     = pacman glibc
Architecture = x86_64
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
